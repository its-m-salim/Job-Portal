{% extends "base.html" %}

{% block title %}Профиль соискателя{% endblock %}

{% block content %}
    <h1>Профиль соискателя</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <p>
            <label>ФИО:</label><br>
            <input type="text" name="full_name" required>
        </p>
        <p>
            <label>Город:</label><br>
            <input type="text" name="city" required>
        </p>
        <p>
            <label>О себе:</label><br>
            <textarea name="about" rows="4" cols="40"></textarea>
        </p>
        <p>
            <label>Навыки:</label><br>
            <textarea name="skills" rows="4" cols="40" required></textarea>
        </p>
        <p>
            <label>Опыт (лет):</label><br>
            <input type="number" name="experience" min="0">
        </p>
        <p>
            <label>Резюме (файл):</label><br>
            <input type="file" name="resume">
        </p>

        <button type="submit">Сохранить</button>
    </form>
{% endblock %}
