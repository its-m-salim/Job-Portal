{% extends "base.html" %}
{% block title %}Создание компании{% endblock %}

{% block content %}
<div class="narrow section">
  <h1>Расскажите о компании</h1>
  <p class="lead">Это увидят соискатели на страницах ваших вакансий.</p>

  {% include "includes/error.html" %}

  <form method="post" enctype="multipart/form-data" class="form form-card">
    {% csrf_token %}
    {% include "includes/company_fields.html" %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Создать компанию</button>
    </div>
  </form>
</div>
{% endblock %}
