{% extends "base.html" %}
{% block title %}Выбор роли{% endblock %}

{% block content %}
<div class="narrow section">
  <h1>Кто вы на JobPortal?</h1>
  <p class="lead">Роль выбирается один раз, от неё зависят доступные разделы.</p>

  {% include "includes/error.html" %}

  <form method="post">
    {% csrf_token %}
    <div class="role-grid">
      <label class="role">
        <input type="radio" name="role" value="candidate" required>
        <span class="role-card">
          <strong>Ищу работу</strong>
          <span>Смотрю вакансии, откликаюсь и слежу за ответами.</span>
        </span>
      </label>
      <label class="role">
        <input type="radio" name="role" value="employer" required>
        <span class="role-card">
          <strong>Нанимаю сотрудников</strong>
          <span>Размещаю вакансии и разбираю отклики.</span>
        </span>
      </label>
    </div>
    <button class="btn btn-primary" type="submit">Продолжить</button>
  </form>
</div>
{% endblock %}
