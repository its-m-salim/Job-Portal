{% extends "base.html" %}

{% block title %}Выбор роли{% endblock %}

{% block content %}
    <h1>Кто вы?</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>
            <label>
                <input type="radio" name="role" value="employer" required>
                Работодатель
            </label>
        </p>
        <p>
            <label>
                <input type="radio" name="role" value="candidate">
                Соискатель
            </label>
        </p>

        <button type="submit">Продолжить</button>
    </form>
{% endblock %}
