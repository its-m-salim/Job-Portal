{% extends "base.html" %}

{% block title %}Подтверждение почты{% endblock %}

{% block content %}
    <h1>Подтверждение почты</h1>
    <p>Мы отправили 6-значный код на вашу почту.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Код:</label><br>
            <input type="text" name="code" maxlength="6" required>
        </p>
        <button type="submit">Подтвердить</button>
    </form>

    <form method="post" action="{% url 'resend_code' user_id %}">
        {% csrf_token %}
        <button type="submit">Отправить код ещё раз</button>
    </form>
{% endblock %}
